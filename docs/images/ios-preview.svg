<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background iPhone Frame -->
  <rect width="400" height="600" rx="36" fill="#0F172A"/>
  
  <!-- Subtle App Screen Background -->
  <rect x="16" y="16" width="368" height="568" rx="28" fill="#1E293B" opacity="0.9"/>
  <rect x="140" y="24" width="120" height="20" rx="10" fill="#0F172A"/>
  
  <!-- Dimmed overlay behind dialog -->
  <rect x="16" y="16" width="368" height="568" rx="28" fill="#000000" opacity="0.55"/>
  
  <!-- Native iOS StoreKit Modal Dialog -->
  <rect x="50" y="180" width="300" height="250" rx="18" fill="#F8FAFC"/>
  
  <!-- App Icon placeholder -->
  <rect x="172" y="196" width="56" height="56" rx="12" fill="#3B82F6"/>
  <path d="M190 224L198 232L212 216" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Title and Subtitle -->
  <text x="200" y="274" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0F172A">Enjoying this app?</text>
  <text x="200" y="294" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Tap a star to rate on the App Store.</text>
  
  <!-- 5 Star Rating Icons -->
  <g transform="translate(100, 312)">
    <!-- Star 1 -->
    <path d="M16 2L20.2 11.8L30.6 12.8L22.8 19.8L25.1 30.2L16 24.8L6.9 30.2L9.2 19.8L1.4 12.8L11.8 11.8L16 2Z" fill="#F59E0B"/>
    <!-- Star 2 -->
    <path d="M56 2L60.2 11.8L70.6 12.8L62.8 19.8L65.1 30.2L56 24.8L46.9 30.2L49.2 19.8L41.4 12.8L51.8 11.8L56 2Z" fill="#F59E0B"/>
    <!-- Star 3 -->
    <path d="M96 2L100.2 11.8L110.6 12.8L102.8 19.8L105.1 30.2L96 24.8L86.9 30.2L89.2 19.8L81.4 12.8L91.8 11.8L96 2Z" fill="#F59E0B"/>
    <!-- Star 4 -->
    <path d="M136 2L140.2 11.8L150.6 12.8L142.8 19.8L145.1 30.2L136 24.8L126.9 30.2L129.2 19.8L121.4 12.8L131.8 11.8L136 2Z" fill="#F59E0B"/>
    <!-- Star 5 -->
    <path d="M176 2L180.2 11.8L190.6 12.8L182.8 19.8L185.1 30.2L176 24.8L166.9 30.2L169.2 19.8L161.4 12.8L171.8 11.8L176 2Z" fill="#CBD5E1"/>
  </g>
  
  <!-- Divider -->
  <line x1="50" y1="365" x2="350" y2="365" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="200" y1="365" x2="200" y2="430" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Buttons -->
  <text x="125" y="402" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" fill="#3B82F6">Not Now</text>
  <text x="275" y="402" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#3B82F6">Submit</text>
  
  <!-- Badge on top -->
  <rect x="135" y="142" width="130" height="28" rx="14" fill="#0284C7"/>
  <text x="200" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">iOS StoreKit</text>
</svg>
